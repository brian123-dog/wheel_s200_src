cabinet_frame: base_link

vision:
  default_rpy_base: [3.1416, 0.0, 0.0]
  min_pixels: 10
  depth_window_px: 7
  depth_scale_m: 0.001
  min_depth_m: 0.15
  max_depth_m: 1.50
  workspace_bounds:
    x: [-0.30, 1.20]
    y: [-0.90, 0.90]
    z: [-0.30, 1.30]
  targets:
    start_button:
      kind: button
      rgb_min: [180, 0, 0]
      rgb_max: [255, 90, 90]
      min_pixels: 10
      depth_window_px: 9
      offset_base_m: [0.0, 0.0, 0.0]
      rpy_base: [3.1416, 0.0, 0.0]
    mode_toggle:
      kind: toggle_switch
      rgb_min: [0, 140, 0]
      rgb_max: [90, 255, 90]
      min_pixels: 10
      depth_window_px: 9
      offset_base_m: [0.0, 0.0, 0.0]
      rpy_base: [3.1416, 0.0, 0.0]
    selector_knob:
      kind: knob
      rgb_min: [0, 0, 140]
      rgb_max: [90, 90, 255]
      min_pixels: 10
      depth_window_px: 9
      offset_base_m: [0.0, 0.0, 0.0]
      rpy_base: [3.1416, 0.0, 0.0]

default_contact:
  approach_speed_mps: 0.006
  servo_period_s: 0.1
  max_contact_travel_m: 0.025
  timeout_s: 5.0
  contact_force_n: 6.0

mock_states:
  start_button: pressed
  mode_toggle: "on"
  selector_knob: auto

sequence:
  - name: start_button
    skill: button
    observation_pose:
      move_speed_mps: 0.05
      settle_s: 0.5
    target:
      source: camera
      detection: start_button
      kind: button
    params:
      pre_offset_m: 0.04
      press_start_offset_m: 0.008
      retract_m: 0.03
      approach_axis: z
      approach_sign: -1.0
      approach_offset_frame: tool
      move_speed_mps: 0.03
    verify:
      sensor: start_button
      expected: pressed

  - name: mode_toggle
    skill: toggle
    observation_pose:
      move_speed_mps: 0.05
      settle_s: 0.5
    target:
      source: camera
      detection: mode_toggle
      kind: toggle_switch
    params:
      axis: y
      throw_distance_m: 0.025
      pre_offset_m: 0.035
      approach_axis: z
      approach_sign: -1.0
      approach_offset_frame: tool
      move_speed_mps: 0.03
    verify:
      sensor: mode_toggle
      expected: "on"

  - name: selector_knob
    skill: knob
    observation_pose:
      move_speed_mps: 0.05
      settle_s: 0.5
    target:
      source: camera
      detection: selector_knob
      kind: knob
    params:
      turn_angle_rad: -0.7854
      angular_speed_radps: 0.35
      pre_offset_m: 0.045
      approach_axis: z
      approach_sign: -1.0
      approach_offset_frame: tool
      move_speed_mps: 0.03
    verify:
      sensor: selector_knob
      expected: auto

  - name: panel_meter
    skill: read_meter
    observation_pose:
      move_speed_mps: 0.05
      settle_s: 0.5
    params:
      save_dir: meter_results
      image_prefix: panel_meter
