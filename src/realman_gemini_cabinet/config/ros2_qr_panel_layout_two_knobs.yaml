# Optional MoveL alignment rerouting; 10 cm downward clearance confirmed by operator.
cabinet_frame: base_link

vision:
  # Only panel_layout uses this policy; legacy locators keep their behavior.
  # Failed samples are always saved, even when successful image saving is off.
  fresh_sampling:
    enabled: true
    max_attempts: 5
    total_timeout_s: 6.0
    frame_wait_timeout_s: 2.0
    max_frame_age_s: 0.75
    max_rgbd_skew_s: 0.15
    confirmation_frames: 2
    max_center_delta_px: 5.0
    max_depth_delta_m: 0.015
  save_debug_images: false
  vision_debug_dir: vision_debug
  default_rpy_base: [0.0, -1.5708, 0.0]
  min_pixels: 20
  depth_window_px: 9
  depth_scale_m: 0.001
  min_depth_m: 0.15
  max_depth_m: 1.50
  workspace_bounds:
    x: [-1.20, 0.20]
    y: [-0.90, 0.90]
    z: [-0.30, 1.30]
  targets:
    lower_left_red_button:
      kind: button
      rgb_min: [120, 0, 0]
      rgb_max: [255, 90, 90]
      min_pixels: 20
      depth_window_px: 9
      depth_fallback: bbox_ring
      depth_fallback_margin_px: 30
      depth_fallback_exclude_padding_px: 4
      depth_fallback_min_samples: 10
      min_depth_m: 0.15
      max_depth_m: 0.50
      offset_base_m: [0.0, 0.0, 0.0]
      rpy_base: [0.0, -1.5708, 0.0]
    middle_black_knob:
      kind: knob
      locator: panel_layout
      # Cold template loading and consistency retries share this bounded budget.
      fresh_sampling:
        enabled: true
        max_attempts: 5
        total_timeout_s: 12.0
        frame_wait_timeout_s: 2.0
        max_frame_age_s: 0.75
        max_rgbd_skew_s: 0.15
        confirmation_frames: 2
        max_center_delta_px: 5.0
        max_depth_delta_m: 0.015
      panel_layout_template: panel_layout/template.json
      panel_layout_templates:
        - panel_layout/template.json
        - panel_layout/template_largest.json
        - panel_layout/template_smallest.json
        - panel_layout/template_left.json
        - panel_layout/template_right.json
        - panel_layout/template_distant_panel.json
      panel_layout_target_id: middle_black_knob
      alignment_reference: tcp_frame
      tcp_frame: gripper_base_link
      tcp_offset_m: [-0.0, 0.04, 0.19]
      rgb_min: [0, 0, 0]
      rgb_max: [100, 100, 100]
      frame_rgb_min: [0, 0, 0]
      frame_rgb_max: [140, 140, 140]
      roi: [460, 200, 280, 240]          # 收紧并下移，聚焦面板区域
      desired_pixel: [640, 322]           # 图像中心点调整 (2x, 1.5x)
      knob_center_offset_px: [0.0, 0.0]
      plate_saturation_max: 40             # 黑色饱和度极低，从 80 收紧
      plate_value_min: 0                  # 不设下限，纯黑 V=0
      plate_value_max: 55                 # 只抓暗色像素，排除银灰柜体
      plate_min_area_px: 2100             # 700 × 3
      plate_max_area_px: 180000           # 60000 × 3
      plate_min_width_px: 40              # 20 × 2
      plate_max_width_px: 600             # 300 × 2
      plate_min_height_px: 30             # 20 × 1.5
      plate_max_height_px: 450            # 300 × 1.5
      plate_min_aspect_ratio: 0.55
      plate_max_aspect_ratio: 1.80
      plate_close_kernel_px: 3             # 从 9 降到 3，只闭合细小缝隙
      plate_close_iterations: 1           # 从 2 降到 1
      plate_min_rectangularity: 0.55
      plate_min_mask_coverage: 0.45
      min_pixels: 60                      # 20 × 3
      max_pixels: 60000                   # 20000 × 3
      min_bbox_width_px: 10               # 5 × 2
      max_bbox_width_px: 400              # 200 × 2
      min_bbox_height_px: 8               # 5 × 1.5
      max_bbox_height_px: 300             # 200 × 1.5
      frame_min_pixels: 120               # 40 × 3
      frame_min_size_px: 36               # 18 × 2
      frame_max_size_px: 400              # 200 × 2
      frame_aspect_tolerance: 0.25
      frame_edge_tolerance_px: 2
      frame_min_edge_score: 0.45
      frame_min_side_coverage: 0.30
      frame_max_fill_ratio: 0.70
      frame_scan_step_px: 1
      depth_window_px: 18                 # 9 × 2 (代码自动按 depth/color 缩放)
      depth_fallback: bbox_ring
      depth_fallback_margin_px: 60        # 30 × 2
      depth_fallback_exclude_padding_px: 8  # 4 × 2
      depth_fallback_min_samples: 10
      min_depth_m: 0.10
      max_depth_m: 1.20
      offset_base_m: [0.0, 0.0, 0.0]
      rpy_base: [0.0, -1.5708, 0.0]
      workspace_bounds:
        x: [-1.05, -0.55]
        y: [-0.40, 0.40]
        z: [0.05, 0.90]
    upper_row_right_black_knob:
      kind: knob
      locator: panel_layout
      # Far view: accept the first fresh frame that passes all image/depth checks.
      # Retry rejected frames within the same bounded budget.
      fresh_sampling:
        enabled: true
        max_attempts: 5
        total_timeout_s: 12.0
        frame_wait_timeout_s: 2.0
        max_frame_age_s: 0.75
        max_rgbd_skew_s: 0.15
        confirmation_frames: 1
        max_center_delta_px: 5.0
        max_depth_delta_m: 0.015
      panel_layout_template: panel_layout_right_knob/template_observation.json
      panel_layout_templates:
      - panel_layout_right_knob/template_observation.json
      - panel_layout_right_knob/template_upper_row_right.json
      - panel_layout_right_knob/template_upper_row_right_right.json
      - panel_layout_right_knob/template_upper_row_right_smallest.json
      - panel_layout_right_knob/template_user_front_1.json
      - panel_layout_right_knob/template_user_front_2.json
      - panel_layout_right_knob/template_user_front_3.json
      - panel_layout_right_knob/template_user_front_4.json
      panel_layout_target_id: upper_row_right_black_knob
      alignment_reference: tcp_frame
      tcp_frame: gripper_base_link
      tcp_offset_m:
      - -0.0
      - 0.03
      - 0.19
      rgb_min:
      - 0
      - 0
      - 0
      rgb_max:
      - 100
      - 100
      - 100
      frame_rgb_min:
      - 0
      - 0
      - 0
      frame_rgb_max:
      - 140
      - 140
      - 140
      roi:
      - 460
      - 200
      - 280
      - 240
      desired_pixel:
      - 640
      - 322
      knob_center_offset_px:
      - 0.0
      - 0.0
      plate_saturation_max: 40
      plate_value_min: 0
      plate_value_max: 55
      plate_min_area_px: 2100
      plate_max_area_px: 180000
      plate_min_width_px: 40
      plate_max_width_px: 600
      plate_min_height_px: 30
      plate_max_height_px: 450
      plate_min_aspect_ratio: 0.55
      plate_max_aspect_ratio: 1.8
      plate_close_kernel_px: 3
      plate_close_iterations: 1
      plate_min_rectangularity: 0.55
      plate_min_mask_coverage: 0.45
      min_pixels: 60
      max_pixels: 60000
      min_bbox_width_px: 10
      max_bbox_width_px: 400
      min_bbox_height_px: 8
      max_bbox_height_px: 300
      frame_min_pixels: 120
      frame_min_size_px: 36
      frame_max_size_px: 400
      frame_aspect_tolerance: 0.25
      frame_edge_tolerance_px: 2
      frame_min_edge_score: 0.45
      frame_min_side_coverage: 0.3
      frame_max_fill_ratio: 0.7
      frame_scan_step_px: 1
      depth_window_px: 18
      depth_fallback: bbox_ring
      depth_fallback_margin_px: 20
      depth_fallback_exclude_padding_px: 6
      depth_fallback_min_samples: 10
      min_depth_m: 0.1
      max_depth_m: 1.2
      offset_base_m:
      - 0.0
      - 0.0
      - 0.0
      rpy_base:
      - 0.0
      - -1.5708
      - 0.0
      workspace_bounds:
        x:
        - -1.05
        - -0.55
        y:
        - -0.4
        - 0.4
        z:
        - 0.05
        - 0.9
    rightmost_green_rocker:
      kind: toggle_switch
      rgb_min: [0, 90, 40]
      rgb_max: [90, 255, 170]
      min_pixels: 20
      depth_window_px: 9
      depth_fallback: bbox_ring
      depth_fallback_margin_px: 30
      depth_fallback_exclude_padding_px: 4
      depth_fallback_min_samples: 10
      min_depth_m: 0.15
      max_depth_m: 0.50
      offset_base_m: [0.0, 0.0, 0.0]
      rpy_base: [0.0, -1.5708, 0.0]

default_contact:
  approach_speed_mps: 0.004
  servo_period_s: 0.1
  max_contact_travel_m: 0.015
  timeout_s: 5.0
  contact_force_n: 50.0

sequence:
  - name: upper_meters
    skill: read_meter
    observation_pose:
      qr_name: upper_meters
      move_speed_mps: 0.05
      settle_s: 0.5
    params:
      save_dir: meter_results
      image_prefix: upper_meters

  - name: middle_black_knob
    skill: knob_camera_servo
    observation_pose:
      qr_name: middle_black_knob
      move_speed_mps: 0.05
      settle_s: 0.5
    target:
      source: camera
      detection: middle_black_knob
      kind: knob
    params:
      alignment_reroute: true
      alignment_reroute_drop_clearance_m: 0.10
      alignment_preflight: true
      alignment_preflight_step_m: 0.001
      alignment_preflight_min_margin_deg: 5.0
      alignment_preflight_max_joint_step_deg: 5.0
      align_axes: [y, z]
      align_speed_mps: 0.010
      min_align_m: 0.005
      max_align_axis_m: 0.800
      max_align_total_m: 0.900
      intermediate_check_distance_m: 0.0
      median_samples: 3
      detection_interval_s: 0.3
      actuation_rpy_base: [0.0, -1.5708, 0.0]
      orientation_speed_mps: 0.02
      approach_axis: x
      approach_sign: -1.0
      approach_frame: base
      approach_distance_m: 0.060
      approach_speed_mps: 0.05
      open_loop_advance_m: 0.085
      open_loop_advance_speed_mps: 0.004
      retract_m: 0.30
      require_contact: false
      contact_mode: open_loop
      turn_axis: z
      turn_frame: tool
      turn_angle_rad: 1.5708
      angular_speed_radps: 0.35
      gripper_open: 0.4
      gripper_closed: 1.0
      gripper_settle_s: 1.5
      release_after_turn: true

  # Upper row black round-base knob, after middle knob has released/retracted.
  - name: upper_row_right_black_knob
    skill: knob_camera_servo
    observation_pose:
      source: fixed
      frame: base_link
      move_speed_mps: 0.05
      settle_s: 0.5
      position:
        x: -0.3334310054779053
        y: -0.0026940000243484974
        z: 0.5271419882774353
      orientation:
        x: 0.0006479999865405262
        y: -0.7373149991035461
        z: -0.011230000294744968
        w: 0.6754540205001831
    target:
      source: camera
      detection: upper_row_right_black_knob
      kind: knob
      # Close-range centering still requires two consistent fresh RGB-D frames.
      precontact_fresh_sampling:
        enabled: true
        max_attempts: 5
        total_timeout_s: 12.0
        frame_wait_timeout_s: 2.0
        max_frame_age_s: 0.75
        max_rgbd_skew_s: 0.15
        confirmation_frames: 2
        max_center_delta_px: 5.0
        max_depth_delta_m: 0.015
    params:
      alignment_reroute: true
      alignment_reroute_drop_clearance_m: 0.1
      alignment_preflight: true
      alignment_preflight_step_m: 0.001
      alignment_preflight_min_margin_deg: 5.0
      alignment_preflight_max_joint_step_deg: 5.0
      align_axes:
      - y
      - z
      align_speed_mps: 0.01
      min_align_m: 0.005
      max_align_axis_m: 0.8
      max_align_total_m: 0.9
      intermediate_check_distance_m: 0.0
      # Reacquire after fast approach; verify Y/Z centering before slow contact.
      precontact_centering: true
      precontact_panel_layout_templates:
      - panel_layout_right_knob/precontact/template.json
      - panel_layout_right_knob/precontact/template_1401.json
      - panel_layout_right_knob/precontact/template_1417.json
      precontact_centering_tolerance_m: 0.002
      precontact_centering_max_axis_m: 0.015
      precontact_centering_max_error_m: 0.030
      precontact_centering_max_total_m: 0.040
      precontact_centering_max_corrections: 2
      precontact_centering_speed_mps: 0.005
      precontact_centering_settle_s: 0.3
      median_samples: 1
      detection_interval_s: 0.3
      actuation_rpy_base:
      - 0.0
      - -1.5708
      - 0.0
      orientation_speed_mps: 0.02
      approach_axis: x
      approach_sign: -1.0
      approach_frame: base
      approach_distance_m: 0.06
      approach_speed_mps: 0.05
      open_loop_advance_m: 0.085
      open_loop_advance_speed_mps: 0.004
      retract_m: 0.3
      require_contact: false
      contact_mode: open_loop
      turn_axis: z
      turn_frame: tool
      turn_angle_rad: 1.0471975511965976
      angular_speed_radps: 0.35
      gripper_open: 0.4
      gripper_closed: 1.0
      gripper_settle_s: 1.5
      release_after_turn: true

  # 序列结束后的统一收敛点：绝对关节角 MoveJ（安全位姿）
  # joint_positions 为弧度，顺序 J1..J6，取自 /rm_driver/udp_arm_position 实测状态
  - name: safe_pose
    skill: move_joint
    params:
      joint_positions: [0.013192, 1.494209, -2.767605, -0.026088, -1.218446, 0.010173]
      speed_mps: 0.05
      settle_s: 0.5
