cabinet_frame: base
default_contact:
  approach_speed_mps: 0.006
  servo_period_s: 0.1
  max_contact_travel_m: 0.025
  timeout_s: 5.0
  contact_force_n: 6.0

mock_states:
  start_button: pressed
  mode_toggle: "on"
  selector_knob: auto
  cabinet_handle: open

sequence:
  - name: start_button
    skill: button
    target:
      kind: button
      frame: base
      pose: [0.45, 0.10, 0.20, 3.1416, 0.0, 0.0]
    params:
      pre_offset_m: 0.04
      press_start_offset_m: 0.008
      retract_m: 0.03
    verify:
      sensor: start_button
      expected: pressed

  - name: mode_toggle
    skill: toggle
    target:
      kind: toggle_switch
      frame: base
      pose: [0.46, 0.02, 0.22, 3.1416, 0.0, 0.0]
    params:
      axis: y
      throw_distance_m: 0.025
      pre_offset_m: 0.035
    verify:
      sensor: mode_toggle
      expected: "on"

  - name: selector_knob
    skill: knob
    target:
      kind: knob
      frame: base
      pose: [0.47, -0.06, 0.24, 3.1416, 0.0, 0.0]
    params:
      turn_angle_rad: -0.7854
      angular_speed_radps: 0.35
      pre_offset_m: 0.045
    verify:
      sensor: selector_knob
      expected: auto

  - name: cabinet_handle
    skill: door
    target:
      kind: door_handle
      frame: base
      pose: [0.50, -0.16, 0.28, 3.1416, 0.0, 0.0]
    params:
      pull_distance_m: 0.18
      lift_distance_m: 0.03
      steps: 8
    verify:
      sensor: cabinet_handle
      expected: open
