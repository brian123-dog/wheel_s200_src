controller_server:
  ros__parameters:
    use_sim_time: False                             
    controller_frequency: 15.0                      #运行控制器的频率 (hz)30-25hz，过高可能导致控制器过载，过低可能导致响应迟钝
    controller_plugins: ["FollowPath"]              # 用于处理请求和参数的控制器插件的映射名称列表
    odom_topic: /odom_combined                      #里程计话题名称

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"] # "precise_goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.07
      stateful: True

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController" #旋转控制器
      primary_controller: "dwb_core::DWBLocalPlanner" #DWB控制器
      
      # 旋转控制器参数
      angular_dist_threshold: 0.20  # 角度阈值（约 10.3°），超过此值会触发旋转
      forward_sampling_distance: 0.5  # 向前采样的距离
      rotate_to_heading_angular_vel: 0.7  # 旋转到航向的角速度
      max_angular_accel: 1.2  # 最大角加速度
      simulate_ahead_time: 1.0  # 模拟提前时间
      
      # DWB控制器基本参数
      min_vel_x: 0.0       # 最小前进速度（禁用倒车，减少反复后退）
      min_vel_y: 0.0       # 最小横向速度（差速机器人设为0）
      max_vel_x: 0.16      # 最大前进速度（适当下调，提升复杂场景避障稳定性）
      max_vel_y: 0.0       # 最大横向速度（差速机器人设为0）
      max_vel_theta: 0.7   # 最大角速度（提升终点角度收敛能力）
      min_speed_xy: 0.0    # 最小平移速度
      max_speed_xy: 0.16   # 最大平移速度
      min_speed_theta: 0.12  # 最小角速度
      
      # 加速度限制（根据S200机器人调整）
      acc_lim_x: 0.55       # 最大前进加速度
      acc_lim_y: 0.0       # 最大横向加速度
      acc_lim_theta: 1.0   # 最大角加速度
      decel_lim_x: -0.75    # 最大前进减速度
      decel_lim_y: 0.0     # 最大横向减速度
      decel_lim_theta: -1.0 # 最大角减速度
      
      # 速度采样
      vx_samples: 15       # X方向速度样本数
      vy_samples: 0        # Y方向速度样本数（差速机器人设为0）
      vtheta_samples: 40   # 角速度样本数（提高局部避障搜索密度）
      
      # 轨迹生成参数
      sim_time: 2.0        # 提前模拟时间（更早感知并规避前方障碍）
      angular_granularity: 0.05  # 角度粒度
      linear_granularity: 0.01   # 线性粒度
      
      # 容差参数
      transform_tolerance: 0.35   # TF变换容差0.1-0.12
      xy_goal_tolerance: 0.08    # 目标位置容差
      yaw_goal_tolerance: 0.10   # 目标角度容差
      trans_stopped_velocity: 0.01 # 停止速度阈值
      rot_stopped_velocity: 0.01   # 停止角速度阈值
      
      # 优化参数
      short_circuit_trajectory_evaluation: true
      stateful: true
      debug_trajectory_details: false
      
      # 评论器（Critics）配置
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      
      # 各评论器权重
      BaseObstacle:
        scale: 4.0
        sum_scores: false
        collision_cost: 10000.0
      PathAlign:
        scale: 20.0
        forward_point_distance: 0.15
      GoalAlign:
        scale: 16.0
        forward_point_distance: 0.15
      PathDist:
        scale: 48.0
      GoalDist:
        scale: 32.0
      RotateToGoal:
        scale: 80.0
        slowing_factor: 5.0
        lookahead_time: -1.0
      Oscillation:
        oscillation_reset_dist: 0.05
        oscillation_reset_angle: 0.05
        oscillation_reset_time: 0.0
      
      # 轨迹生成器插件
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      goal_checker_name: "dwb_plugins::SimpleGoalChecker"
      velocity_iterator_name: "dwb_plugins::LimitedAccelGenerator"
#参数参考：https://docs.nav2.org/configuration/packages/configuring-mppic.html


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False
  # ros__parameters:的角色，避免你把“上位机控制层”和“底盘驱动层”混在一起。

# Searched for regular expressions and parameters

#     use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 12.0  #提升局部代价地图刷新速度，增强动态障碍响应
      publish_frequency: 6.0 #将成本图发布到话题的频率
      global_frame: odom_combined      #局部地图使用里程计框架，更利于实时避障
      robot_base_frame: base_footprint #机器人底座框架
      use_sim_time: False  #仿真时间
      transform_tolerance: 0.5   # TF变换容差，容忍雷达时间戳轻微倒挂
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 4             #代价地图的宽度（m）
      height: 4            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      footprint_padding: 0.03  #足迹额外膨胀，给避障留安全冗余
      #robot_radius: 0.30   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[[-0.55, -0.3280], [-0.55, 0.3280], [0.144, 0.3280], [0.144, -0.3280]]"
      plugins: ["obstacle_layer","inflation_layer"] #插件包括:{“障碍层”，“膨胀层”}
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 6.0                    #降低衰减速度，让障碍影响更平滑
        inflation_radius: 0.4                      #适度增大局部膨胀半径，提升贴边安全性
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"      #障碍层插件。
        enabled: True
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        observation_sources: scan                  #观测源
        scan:
          topic: /scan
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          inf_is_valid: true
          observation_persistence: 0.2
          raytrace_max_range: 8.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 5.5                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围

      always_send_full_costmap: True                 #是否每次更新时都发送完整的成本图，而不是更新
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0             #成本地图更新频率
      publish_frequency: 1.0            #将成本图发布到话题的频率
      global_frame: map                 #全局框架
      robot_base_frame: base_footprint  #机器人底座框架
      use_sim_time: False               #仿真时间 
      transform_tolerance: 0.5          # TF变换容差，容忍雷达时间戳轻微倒挂
      #robot_radius: 0.20                #机器人半径
      footprint: "[[-0.55, -0.3280], [-0.55, 0.3280], [0.144, 0.3280], [0.144, -0.3280]]"
      footprint_padding: 0.03
      resolution: 0.05                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        observation_sources: scan                  #观测源
        scan:
          topic: /scan
          max_obstacle_height: 2.0                 #可检测障碍物的最大高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 12.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 6.0                 #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                  #控制代价地图上标记障碍物的最小范围
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 6.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.40                     #增大全局膨胀，优先规划更安全走廊
      always_send_full_costmap: True               #是否每次更新时都发送完整的成本图，而不是更新
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "WHEELTEC.yaml"
    bond_heartbeat_period: 2.0  # map_server 心跳从默认 0.1s → 2s（ARM 友好）

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0                #尝试保存地图的超时时间（秒）
    free_thresh_default: 0.25            #占用网格的自由空间最大概率阈值
    occupied_thresh_default: 0.65        #占用网格的占用空间最小概率阈值
    map_subscribe_transient_local: True  #地图话题的 QoS 设置

planner_server: #规划器服务器参数
  ros__parameters:
    expected_planner_frequency: 2.0     #预期的规划器频率。如果当前频率小于预期频率，则显示警告消息。
    use_sim_time: False
    planner_plugins: ["GridBased"] #规划器插件类型，需要与BT Tree文件匹配
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                     # tolerance for planning if unable to reach exact pose, in meters, for 2D node
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: false                # allow traveling in unknown space
      max_iterations: 100000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 100    # maximum number of iterations to attempt to reach goal once in tolerance, 2D only
      max_planning_time: 5.0              # max time in s for planner to plan, smooth, and upsample. Will scale maximum smoothing and upsampling times based on remaining time after planning.
      motion_model_for_search: "DUBIN"   # 2D Moore, Von Neumann; Hybrid Dubin, Redds-Shepp; State Lattice set internally
      cost_travel_multiplier: 5.0         # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      angle_quantization_bins: 72         # For Hybrid/Lattice nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
      analytic_expansion_ratio: 3.5       # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_cost: 200.0
      minimum_turning_radius: 0.20        # For Hybrid/Lattice nodes: minimum turning radius in m of path / vehicle
      reverse_penalty: 1.2                # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.6                # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 2.0         # For Hybrid nodes: penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 4.0                   # For Hybrid nodes: penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      lookup_table_size: 20.0             # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: True      # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.     
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 0.1  #TF transform tolerance.
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0 #运行行为插件的频率。
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] #插件包括：{“旋转”、“后退”、“前进”、“等待”}
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.5 #TF 变换容差（从 0.1 增大到 0.5）
    use_sim_time: False
    simulate_ahead_time: 2.0 #提前模拟
    max_rotational_vel: 0.3  #最大旋转速度（弧度/秒）
    min_rotational_vel: 0.05 #最小旋转速度（弧度/秒）
    rotational_acc_lim: 0.3  #最大旋转加速度（rad/s^2）

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20 #循环速率
    stop_on_failure: false #如果单个航点失败，是否使操作任务失败。如果为 false，将继续到下一个航点。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200 #机器人到达每个航点后休眠/等待的时间（以毫秒为单位）
#waypoint_follower 参数参考
#https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html?highlight=stop_on_failure

# ---- RDK S100 ARM64 性能补充: 放宽 bond/超时避免心跳超时导致 lifecycle bringup 失败 ----
lifecycle_manager_localization:
  ros__parameters:
    bond_timeout: 20.0          # bond 心跳超时从默认 4s → 20s
    bond_respawn_max_duration: 60.0
    attempt_respawn_reconnection: true

lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 20.0
    bond_respawn_max_duration: 60.0
    attempt_respawn_reconnection: true
