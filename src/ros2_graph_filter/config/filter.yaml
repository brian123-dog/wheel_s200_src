# =============================================================================
# ros2_graph_filter 默认过滤器配置文件
# =============================================================================
# 本文件定义节点拓扑图的过滤与聚合规则。
# - hide_nodes:   正则表达式列表，匹配到的节点名称将在图中隐藏
# - hide_topics:  正则表达式列表，匹配到的话题名称将在图中隐藏
# - aggregate_groups: 节点聚合组定义，将多个节点聚合成一个逻辑组节点
# =============================================================================

# ---------------------------------------------------------------------------
# 隐藏节点规则 —— 匹配这些正则表达式的节点不会出现在拓扑图中
# ---------------------------------------------------------------------------
hide_nodes:
  # Navigation2 内部节点（通常不需要在论文中展示）
  - "/local_costmap"
  - "/global_costmap"
  - "/planner_server"
  - "/controller_server"
  - "/lifecycle_manager_navigation"
  - "/lifecycle_manager_localization"

  # TF 变换相关节点
  - "/transform_listener_impl.*"

  # 可视化与仿真工具节点
  - "/rviz.*"
  - "/gazebo.*"

  # ROS2 系统内部节点
  - "/rosout.*"

  # 遥操作与手柄节点
  - "/teleop.*"
  - "/joy_node"

  # 仿真实体生成节点
  - "/spawn_entity.*"

# ---------------------------------------------------------------------------
# 隐藏话题规则 —— 匹配这些正则表达式的话题不会出现在拓扑图中
# ---------------------------------------------------------------------------
hide_topics:
  # ROS2 系统内部话题
  - "/parameter_events"
  - "/rosout"
  - "/rosout_agg"

# ---------------------------------------------------------------------------
# 节点聚合组 —— 将多个节点合并为一个逻辑组，隐藏组内连线
# ---------------------------------------------------------------------------
aggregate_groups:
  - name: "睿尔曼机械臂控制节点群"     # 聚合组的中文显示名称
    nodes:                               # 组内节点列表（完全匹配节点名称）
      - "/rm_driver"
      - "/rm_control"
      - "/arm_task_service_node"
      - "/moveit_simple_controller_manager"
      - "/gripper_joint_state_node"
      - "/joint_state_publisher"
    style: "dashed_box"                  # 聚合组边框样式：dashed_box（虚线矩形）
