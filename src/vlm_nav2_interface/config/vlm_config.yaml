# ==========================================
# VLM 配置（非敏感信息）
# API Key 请通过环境变量 DASHSCOPE_API_KEY 传入
# ==========================================

vlm:
  # 模型名称
  # 可选：qwen-vl-plus（推荐）, qwen-vl-max，qwen3-vl-flash，qwen3.6-flash，qwen3.6-35b-a3b
  model_name: "qwen3-vl-flash"
  
  # DashScope API 地址
  base_http_api_url: "https://dashscope.aliyuncs.com/api/v1"
  
  # 温度参数，0表示确定性最高（导航任务不需要创意）
  temperature: 0.0

# 拓扑配置文件路径（相对于功能包根目录或绝对路径）
topology_path: "/home/brian/vlm+ros2_nav2/vlm_nav2_step1/topology.yaml"